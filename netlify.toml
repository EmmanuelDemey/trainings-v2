# Deploys the workshops site (at the root) and the slide decks (under /slides/).
#
# Netlify must be configured with an EMPTY base directory, so that this file is
# the one that is read — training/netlify.toml is a leftover of an older setup
# and only applies if the base directory is set to `training`.

[build]
  command = "node scripts/build-all.mjs"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  # pnpm, not npm: Netlify picks it up from pnpm-lock.yaml and the
  # `packageManager` field of package.json, and installs that exact version
  # before running the build command — which is what puts `pnpm` on PATH for
  # scripts/build-all.mjs.
  #
  # The build installs training/ and site/ itself, each being its own pnpm root
  # with its own lockfile. The root install only brings in the build script's own
  # dependencies and the two build plugins declared below — devDependencies
  # included, which Netlify installs by default.
  #
  # No NPM_FLAGS here: pnpm neither audits nor prints funding notices, and the
  # flags npm took are not its.

# The SPA fallback for the decks is generated into build/_redirects by the build
# script, so it stays in sync with the list of trainings in scripts/trainings.mjs.

[[headers]]
  for = "/_pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/slides/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Build plugins ────────────────────────────────────────────────────────────
# Both are declared in package.json (devDependencies) so Netlify installs the
# pinned versions rather than resolving them itself.

# Every internal link and asset reference, crawled from build/index.html: the
# workshop pages, the /downloads/ PDFs and ZIPs, the decks under /slides/. A
# renamed workshop or a download that the build did not produce fails the deploy
# instead of shipping a 404. Runs in a few seconds on the full build.
#
# It runs BEFORE the deploy, so it can only ever read the built files — and it
# maps absolute URLs onto them by comparing their origin with $URL. That is why
# site/astro.config.mjs stamps $URL, and not $DEPLOY_PRIME_URL, into every page's
# og:url and canonical: any other origin looks external, gets fetched over the
# network from a site that does not have these pages yet, and fails the build.
[[plugins]]
  package = "netlify-plugin-checklinks"

  [plugins.inputs]
    # Relative to the publish dir: start at build/index.html and follow.
    entryPoints = ["*.html"]
    recursive = true
    pretty = true
    # External links are not checked (checkExternal = false), but external
    # *assets* still are — the Slidev decks pull their fonts and a couple of
    # scripts from these hosts. A slow third party must not fail our deploy.
    skipPatterns = [
      "fonts.googleapis.com",
      "fonts.gstatic.com",
      "cdn.jsdelivr.net",
      # The 404 page is emitted as build/404.html — Netlify serves it for unknown
      # paths — but it advertises itself as /404/. That address is never a 200 by
      # construction, so its own og:url is the one link that cannot be checked.
      # Matching the expected result, not the file, keeps this to that single check
      # instead of silencing every link the 404 page carries.
      "200 build/404",
    ]
    todoPatterns = []
    checkExternal = false
    followSourceMaps = false

# Lighthouse on the deployed pages. Report only: it runs after the deploy is
# live and posts the scores to the deploy summary. To make it a gate, set
# thresholds below and fail_deploy_on_score_thresholds = "true" — it then runs
# before the deploy and blocks it.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # [plugins.inputs.thresholds]
  #   performance = 0.85
  #   accessibility = 0.9
  #   best-practices = 0.9
  #   seo = 0.9

  # The home page — the training picker.
  [[plugins.inputs.audits]]
    path = ""

  [[plugins.inputs.audits]]
    path = "javascript"

  [[plugins.inputs.audits]]
    path = "vuejs-advanced"

  [[plugins.inputs.audits]]
    path = "angular"
