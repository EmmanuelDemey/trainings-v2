# STEP 6 — The pipeline.
#
# One rule governs the whole file: BUILD ONCE, then have every later job consume
# that exact artifact. A job that rebuilds before deploying ships something no
# test ever ran against — and the difference will not show up until production.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The artifact every later job downloads. Nothing downstream runs
      # `npm run build` again.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      # A budget that does not fail the build is a number in a README. This runs
      # after the build, against the same `dist/`, and exits non-zero when a
      # chunk crosses the limit declared in `.size-limit.json`.
      - name: Size budget
        run: npm run size

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The SAME bytes the quality job produced — not a rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Serve the BUILT app, not the dev server: minification, the production
      # Vue build and the real chunk splitting are all things the dev server
      # does not do, and all things that break differently.
      #
      # This workshop ships no e2e suite, so this is a smoke test: the built
      # page is served and holds the mount point. A real suite (Playwright,
      # Cypress…) runs here, against the same URL.
      - name: Smoke-test the build
        run: |
          npx vite preview --port 4173 &
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:4173/ | grep -q '<div id="app">'

  deploy:
    needs: e2e
    # Only from the default branch. A pull request must run every check above and
    # deploy nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Only for `docker/verify-serving.sh` below — the app itself is never
      # rebuilt from these sources.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # The checks of step 5, run against the URL that was just deployed. This is
      # what turns "the deploy succeeded" into "the deploy works".
      - name: Verify the deployed site
        run: bash docker/verify-serving.sh "${{ vars.PRODUCTION_URL }}"
