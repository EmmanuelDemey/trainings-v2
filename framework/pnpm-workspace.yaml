# Its own pnpm root, like site/ and training/: installed on its own, with its own
# lockfile.
packages:
  - packages/*

# strictDepBuilds is on by default since pnpm 11: a dependency with a build
# script that is neither allowed nor denied fails the install.
allowBuilds:
  # Its postinstall downloads a Chromium. training-kit installs it on demand,
  # only for the PDF exports, unless TRAINING_KIT_CHROME points at one already
  # on the machine.
  playwright-chromium: false
  # The platform binaries ship as optional dependencies: neither needs its script.
  esbuild: false
  sharp: false

minimumReleaseAgeExclude:
  - jscpd-darwin-arm64@5.4.0
  - jscpd-darwin-x64@5.4.0
  - jscpd-linux-arm64-gnu@5.4.0
  - jscpd-linux-arm64-musl@5.4.0
  - jscpd-linux-x64-gnu@5.4.0
  - jscpd-linux-x64-musl@5.4.0
  - jscpd-windows-arm64-msvc@5.4.0
  - jscpd-windows-x64-msvc@5.4.0
  - jscpd@5.4.0
