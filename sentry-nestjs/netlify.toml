# One Netlify site per training, built and deployed by
# .github/workflows/deploy-trainings.yml — the site is created on its first
# deploy, nothing to set up in the Netlify UI. It publishes build/: the workshops
# site at the root, the deck under /slides/, the PDFs and ZIPs under /downloads/.
# The CLI reads this file from the folder it deploys from: the headers below apply.
[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  # pnpm, from the `packageManager` field of package.json and pnpm-lock.yaml.
  NODE_VERSION = "24"

[[headers]]
  for = "/slides/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
