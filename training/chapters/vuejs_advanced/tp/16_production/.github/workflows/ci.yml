# STEP 6 — The pipeline.
#
# This workflow is INCOMPLETE on purpose. The `quality` job is already done for
# you: it type-checks, builds ONCE, uploads `dist/` and enforces the size budget.
# Your job is to take that artifact all the way to a deployment — never
# rebuilding it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The artifact every later job downloads. Nothing downstream runs
      # `npm run build` again.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      # A budget that does not fail the build is a number in a README. This runs
      # after the build, against the same `dist/`, and exits non-zero when a
      # chunk crosses the limit declared in `.size-limit.json`.
      - name: Size budget
        run: npm run size

