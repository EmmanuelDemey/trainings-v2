# STEP 7 — The pipeline.
#
# This workflow is INCOMPLETE on purpose: it lints and type-checks, then stops.
# Your job is to take it all the way to a deployment, building the artifact ONCE.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # TODO 7.1: build the app, then upload `dist/` with actions/upload-artifact.
      #   The whole point is to build ONCE and have every later job consume the
      #   same artifact — never rebuild before deploying.
      #
      #   - run: npm run build
      #   - uses: actions/upload-artifact@v7
      #     with: { name: dist, path: dist }

      # TODO 7.2: enforce the size budget declared in `.size-limit.json`.
      #   A budget that does not fail the build is not a budget.
      #
      #   - run: npm run size

