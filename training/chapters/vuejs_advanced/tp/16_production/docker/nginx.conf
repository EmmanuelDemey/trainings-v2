# PLAN B — serving the SPA yourself, with nginx.
#
# This file is INCOMPLETE on purpose, exactly like `netlify.toml`. As it stands
# it serves the home page and nothing else: a hard refresh on /invoices is a 404,
# every asset is re-downloaded on every visit, and `npm run verify:serving` fails.
#
# Edit, then reload without rebuilding anything:
#   docker compose -f docker/compose.yml restart nginx

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # TODO B1: history-mode fallback. `try_files $uri $uri/ =404` is what a plain
  #   file server does — and it is why /invoices 404s on refresh. The router only
  #   exists once index.html has been served, so the server has to serve it for
  #   any path it does not recognise:
  #
  #     location / {
  #       try_files $uri $uri/ /index.html;
  #     }
  #
  #   Note that `vite preview` does this for you, silently. That is exactly why
  #   it cannot prove your production config is right.
  location / {
    try_files $uri $uri/ =404;
  }

  # TODO B2: cache headers. Asset file names are content-hashed, so they can be
  #   cached forever; `index.html` must never be cached, or the browser keeps
  #   loading the previous deployment's manifest and asks for chunks that no
  #   longer exist.
  #
  #     location /assets/ {
  #       add_header Cache-Control "public, max-age=31536000, immutable";
  #     }
  #
  #     location = /index.html {
  #       add_header Cache-Control "no-cache";
  #     }

  # TODO B3: the trap. Once B1 is in place, a request for an asset that does NOT
  #   exist — say a chunk left over in a stale index.html — no longer 404s: it
  #   gets index.html back, with `Content-Type: text/html`. The browser then tries
  #   to parse HTML as JavaScript and you get the classic, useless
  #   `Uncaught SyntaxError: Unexpected token '<'`.
  #
  #   Make /assets/ opt out of the fallback:
  #
  #     location /assets/ {
  #       add_header Cache-Control "public, max-age=31536000, immutable";
  #       try_files $uri =404;
  #     }
  #
  #   A missing asset must fail as a missing asset. Same trap on Netlify and
  #   Vercel, where the catch-all rewrite swallows it just as happily.

  # TODO B4 (bonus): the security headers from the slides — CSP, HSTS,
  #   X-Content-Type-Options, Referrer-Policy, Permissions-Policy. Start with
  #   `Content-Security-Policy-Report-Only` and only enforce once the console is
  #   clean. A Vue build needs NO 'unsafe-eval' — if you had to add it, something
  #   else is wrong.
  #
  #     add_header X-Content-Type-Options "nosniff" always;
  #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  #
  #   Careful: in nginx, `add_header` in a `location` block REPLACES the whole
  #   set inherited from `server`. Headers you declare at server level disappear
  #   from /assets/ responses unless you repeat them.
}
