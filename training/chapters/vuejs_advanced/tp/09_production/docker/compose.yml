# PLAN B — the deploy target that needs no account.
#
# Both services mount `dist/` read-only instead of baking it into an image: you
# rebuild the app, you hit refresh. Use `docker/Dockerfile` when you want the
# real, shippable artifact.
#
#   npm run build
#   docker compose -f docker/compose.yml up -d
#   npm run verify:serving                             # nginx,  :8080
#   npm run verify:serving -- http://localhost:8081    # caddy,  :8081
#   docker compose -f docker/compose.yml down
#
# Pick ONE of the two servers for the workshop. They are both here so you can
# read the same three rules written twice.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:80"
    volumes:
      - ../dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
