<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TP 6 - Interactive interfaces</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Interactive interfaces</h1>
      <p class="subtitle">Four interfaces, four kinds of events.</p>

      <section>
        <h2>1. Counter</h2>
        <button id="decrement" type="button">-</button>
        <output id="count">0</output>
        <button id="increment" type="button">+</button>
        <button id="reset" type="button">Reset</button>
        <p>
          <label><input id="mute" type="checkbox" /> Mute the console</label>
        </p>
      </section>

      <section>
        <h2>2. Character counter</h2>
        <label for="bio">Your bio</label><br />
        <textarea id="bio" rows="3" cols="40"></textarea>
        <p id="bio-counter">0 / 100</p>
      </section>

      <section>
        <h2>3. Sign-up form</h2>
        <form id="signup" novalidate>
          <p>
            <label for="name">Name</label><br />
            <input id="name" name="name" type="text" />
            <span id="name-error" class="error"></span>
          </p>
          <p>
            <label for="email">Email</label><br />
            <input id="email" name="email" type="text" />
            <span id="email-error" class="error"></span>
          </p>
          <button class="primary" type="submit">Sign up</button>
          <span id="signup-success"></span>
        </form>
      </section>

      <section>
        <h2>4. Todo-list</h2>
        <form id="todo-form">
          <input id="todo-input" type="text" placeholder="A new task" />
          <button class="primary" type="submit">Add</button>
        </form>
        <p id="todo-error" class="error"></p>
        <ul id="todo-list"></ul>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
