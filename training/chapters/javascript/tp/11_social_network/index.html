<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini social network</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Mini social network</h1>
      <p class="subtitle">The three days, in one page.</p>

      <section>
        <form id="post-form">
          <p>
            <label for="author">Your name</label><br />
            <input id="author" type="text" placeholder="Ada" />
          </p>
          <p>
            <label for="text">Your message</label><br />
            <textarea id="text" rows="3" placeholder="What's on your mind?"></textarea>
          </p>
          <p id="counter" class="muted">0 / 280</p>
          <p id="form-error" class="error"></p>
          <button id="publish" class="primary" type="submit">Publish</button>
        </form>
      </section>

      <p id="empty-feed" class="muted"></p>
      <div id="feed"></div>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
