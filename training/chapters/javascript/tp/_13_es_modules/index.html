<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TP 13 - Splitting an application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>The cart, in one file</h1>
      <p class="subtitle">
        It works. Everything lives in <code>app.js</code>. Your job is to cut it
        into modules without breaking it.
      </p>

      <section>
        <h2>Cart</h2>
        <form id="add-form">
          <input id="name" type="text" placeholder="Item" required />
          <input id="price" type="number" min="0" step="0.5" placeholder="Price" required />
          <button type="submit" class="primary">Add</button>
        </form>
        <ul id="items"></ul>
        <p id="total"></p>
      </section>

      <section>
        <h2>Statistics</h2>
        <button id="stats" type="button">Compute (loads a module on demand)</button>
        <p id="stats-output" class="muted"></p>
      </section>
    </main>

    <!-- A module is deferred by default: no `defer` attribute needed. -->
    <script type="module" src="app.js"></script>

    <!-- The self-check stays a classic script: it only reads the page. -->
    <script src="checker.js" defer></script>
    <script src="check.js" defer></script>
  </body>
</html>
