services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: tp09-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: tp09-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
