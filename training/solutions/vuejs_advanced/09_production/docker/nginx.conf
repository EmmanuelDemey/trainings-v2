# PLAN B — serving the SPA yourself, with nginx.
#
# Reload without rebuilding anything:
#   docker compose -f docker/compose.yml restart nginx
#   npm run verify:serving

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # B3 — /assets/ FIRST, and it opts out of the fallback.
  #
  # Order matters: nginx picks the longest matching prefix, so this block wins
  # over `location /` for anything under /assets/. Without the `try_files
  # $uri =404`, a request for a chunk that no longer exists (a stale index.html
  # after a deploy) would fall through to the rule below and get index.html back
  # with `Content-Type: text/html`. The browser then parses HTML as JavaScript
  # and reports `Uncaught SyntaxError: Unexpected token '<'` — the least helpful
  # error message in front-end development, for what is really a 404.
  #
  # Same trap on Netlify and Vercel: their catch-all rewrite swallows missing
  # assets just as happily.
  location /assets/ {
    # Content-hashed file names: the content can never change under a given
    # name, so it is safe to cache for a year and never revalidate.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # `add_header` in a location REPLACES the whole inherited set — it does not
    # merge with it. Every security header declared at server level has to be
    # repeated here, or it silently disappears from /assets/ responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    try_files $uri =404;
  }

  # B2 — the manifest must never be cached.
  #
  # `index.html` is the one file whose NAME is stable and whose CONTENT changes
  # on every deploy. Cache it and returning users keep loading the previous
  # deployment's manifest, asking for chunks that were deleted an hour ago.
  #
  # And note WHICH request lands here: `/` is served by `location /` below, whose
  # `try_files` falls through to `/index.html` — an INTERNAL rewrite, which
  # re-enters location matching and lands in this exact block. So the headers
  # repeated here are the ones the home page actually gets. Drop the CSP from
  # this block and `verify-serving.sh` reports it missing on `/`, even though it
  # is declared at server level. That is the `add_header` replacement rule
  # biting through a rewrite you did not think of as one.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
  }

  # B1 — history-mode fallback.
  #
  # `try_files $uri $uri/ =404` is what a plain file server does, and it is why
  # /invoices 404s on a hard refresh: there is no such file. The route only
  # exists once index.html has booted the router, so the server has to serve
  # index.html for any path it does not recognise.
  #
  # `vite preview` does this for you, silently — which is exactly why a green
  # `npm run preview` is not evidence about your production config.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # B4 — security headers, at server level (inherited by `location /`).
  #
  # The CSP is deliberately report-only here: turn it into
  # `Content-Security-Policy` once the browser console reports no violation.
  # A Vue build needs NO 'unsafe-eval' — if you had to add it, something else is
  # wrong (a runtime template compiler, usually).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
  # HSTS only makes sense over TLS; uncomment it behind your HTTPS terminator.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
