<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TP 4 - The window</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>The window</h1>
      <p class="subtitle">What the browser knows, and how to schedule code in time.</p>

      <section>
        <h2>1. What the browser knows</h2>
        <p>Viewport: <strong id="viewport">-</strong></p>
        <p>URL: <strong id="url">-</strong></p>
        <p>Language: <strong id="language">-</strong></p>
      </section>

      <section>
        <h2>2 &amp; 3. Scheduled messages</h2>
        <p id="delayed">waiting...</p>
        <p id="cancelled">this text must never change</p>
      </section>

      <section>
        <h2>4. Countdown</h2>
        <p id="countdown">-</p>
      </section>

      <section id="filler">
        <h2>Scroll down</h2>
        <p>Keep scrolling, the button is at the bottom.</p>
      </section>

      <section>
        <h2>5. Back to top</h2>
        <button id="back-to-top" class="primary" type="button">Back to top</button>
      </section>
    </main>

    <script src="ui.js" defer></script>
    <script src="app.js" defer></script>
    <script src="checker.js" defer></script>
    <script src="check.js" defer></script>
  </body>
</html>
