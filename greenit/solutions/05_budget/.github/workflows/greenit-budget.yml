# The environmental budget of the home page, checked on every pull request.
# A page that goes over one of the limits of budget.json fails the run.
name: Green IT budget

on:
  pull_request:
  push:
    branches: [main]

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure the home page against its budget
        run: pnpm run measure workshops/05_budget --budget workshops/05_budget/budget.json
