name: React Query workshops

# The same guarantee as `vuejs-advanced-workshops.yml`, workshop by workshop:
# the solution passes the given specs, and the starter must NOT.
#
# Each workshop is a standalone npm project, so there is one job per workshop
# rather than one install for the lot.
#
# The fake API (`src/api/`) and the spec of each workshop
# (`src/tests/shared/workshop.spec.ts`) are NOT in git: they are copies of
# `tanstack-query-common/`, which every job writes with the sync before anything
# else. That is also why a change in `tanstack-query-common/` triggers this
# workflow — a shared spec or the shared API can break a React workshop.

on:
  push:
    paths:
      - 'tanstack-query-react/workshops/**'
      - 'tanstack-query-react/solutions/**'
      - 'tanstack-query-common/**'
      - '.github/workflows/tanstack-query-react-workshops.yml'
  pull_request:
    paths:
      - 'tanstack-query-react/workshops/**'
      - 'tanstack-query-react/solutions/**'
      - 'tanstack-query-common/**'
  workflow_dispatch:

jobs:
  workshop:
    name: ${{ matrix.workshop }}
    runs-on: ubuntu-latest
    strategy:
      # One broken workshop must not hide the state of the others.
      fail-fast: false
      matrix:
        workshop:
          - 01_first_queries
          - 02_query_configuration
          - 03_pagination_infinite
          - 04_mutations
          - 05_optimistic_updates

    env:
      SOLUTION: tanstack-query-react/solutions/${{ matrix.workshop }}
      STARTER: tanstack-query-react/workshops/${{ matrix.workshop }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-react/workshops/${{ matrix.workshop }}/.nvmrc

      - name: Copy the shared API and specs into the workshops
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-react

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution passes the shared spec
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      # The spec is part of the typecheck program, so this also proves it only
      # references what the starter already exposes (`renderApp`, the API). A
      # spec that fails to COMPILE would be a broken exercise, not a red test.
      - name: The starter still typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      # `--reporter=default` drops the `github-actions` reporter Vitest adds on
      # its own under CI: every red spec here is expected, and would otherwise
      # surface as an error annotation on a green run.
      - name: The starter must still be unsolved
        working-directory: ${{ env.STARTER }}
        run: |
          if npm test -- --reporter=default; then
            echo "::error::The starter passes the shared spec — an answer leaked into ${{ env.STARTER }}"
            exit 1
          fi
          echo "Starter fails as expected."

  # Workshop 06 is the one where the LEARNER writes the tests: it has no shared
  # spec, and its starter ships `it.todo`s — green from the start. "The starter
  # must fail" is meaningless there, so it gets the opposite check: the starter
  # is green (the todos compile and are reported as todos), and the solution's
  # tests — the worked answer — pass and typecheck.
  testing:
    name: 06_testing
    runs-on: ubuntu-latest

    env:
      SOLUTION: tanstack-query-react/solutions/06_testing
      STARTER: tanstack-query-react/workshops/06_testing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-react/workshops/06_testing/.nvmrc

      - name: Copy the shared API into the workshops
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-react

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution's tests pass
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      - name: The starter typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      - name: The starter is green — nothing but todos
        run: npm test
        working-directory: ${{ env.STARTER }}
