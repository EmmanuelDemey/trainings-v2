name: JavaScript workshops

on:
  push:
    paths:
      - 'javascript/workshops/**'
      - 'javascript/solutions/**'
      - 'javascript/scripts/verify.mjs'
      - '.github/workflows/javascript-workshops.yml'
  pull_request:
    paths:
      - 'javascript/workshops/**'
      - 'javascript/solutions/**'
      - 'javascript/scripts/verify.mjs'
  workflow_dispatch:

jobs:
  verify-solutions:
    name: The 11 solutions still work
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # The version comes from the `packageManager` field of
          # javascript/package.json, so pnpm is pinned in exactly one place.
          package_json_file: javascript/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: javascript/.nvmrc
          cache: pnpm
          cache-dependency-path: javascript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the workshop solutions
        run: pnpm run verify

      - name: The starters must still be unsolved
        # A starter that passes the suite means a solution leaked into it.
        run: |
          if pnpm run verify --dir workshops; then
            echo "::error::The starters pass the solution suite — an answer leaked into javascript/workshops/"
            exit 1
          fi
          echo "Starters fail as expected."
