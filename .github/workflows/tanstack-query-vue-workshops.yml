name: TanStack Query for Vue workshops

# The same guarantee as `vuejs-advanced-workshops.yml`, workshop by workshop:
# the solution passes the given spec, and the starter must NOT.
#
# The spec of each workshop is not in this folder: it lives, with the fake API,
# in tanstack-query-common/ (shared with the React and Angular trainings), and
# the sync copies it into every workshop and solution. Hence the sync step
# after the checkout, and `tanstack-query-common/**` in the paths: a change to
# a shared spec or to the fake API must re-check this training too.
#
# Each workshop is a standalone npm project, so there is one job per workshop
# rather than one install for the lot.

on:
  push:
    paths:
      - 'tanstack-query-vue/workshops/**'
      - 'tanstack-query-vue/solutions/**'
      - 'tanstack-query-common/**'
      - '.github/workflows/tanstack-query-vue-workshops.yml'
  pull_request:
    paths:
      - 'tanstack-query-vue/workshops/**'
      - 'tanstack-query-vue/solutions/**'
      - 'tanstack-query-common/**'
  workflow_dispatch:

jobs:
  workshop:
    name: ${{ matrix.workshop }}
    runs-on: ubuntu-latest
    strategy:
      # One broken workshop must not hide the state of the others.
      fail-fast: false
      matrix:
        workshop:
          - 01_first_queries
          - 02_query_configuration
          - 03_pagination_infinite
          - 04_mutations
          - 05_optimistic_updates

    env:
      SOLUTION: tanstack-query-vue/solutions/${{ matrix.workshop }}
      STARTER: tanstack-query-vue/workshops/${{ matrix.workshop }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-vue/workshops/${{ matrix.workshop }}/.nvmrc

      # The fake API and the spec are gitignored copies: write them first.
      - name: Sync the shared API and specs
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-vue

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution passes the shared spec
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      # The spec is part of the typecheck program, so this also proves it only
      # references what the starter already exposes (`renderApp`, the API). A
      # spec that fails to COMPILE would be a broken exercise, not a red test.
      - name: The starter still typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      # `--reporter=default` drops the `github-actions` reporter Vitest adds on
      # its own under CI: every red spec here is expected, and would otherwise
      # surface as an error annotation on a green run.
      - name: The starter must still be unsolved
        working-directory: ${{ env.STARTER }}
        run: |
          if npm test -- --reporter=default; then
            echo "::error::The starter passes the shared spec — an answer leaked into ${{ env.STARTER }}"
            exit 1
          fi
          echo "Starter fails as expected."

  # Workshop 06 is the one where the LEARNER writes the tests: it has no shared
  # spec, and its starter ships `it.todo`s — green from the start. "The starter
  # must fail" is meaningless there, so it is checked the other way round: the
  # solution's tests pass, and the starter stays green (its todos, its stubs and
  # the app all typecheck and run) — a learner never starts from a red suite.
  testing:
    name: 06_testing
    runs-on: ubuntu-latest

    env:
      SOLUTION: tanstack-query-vue/solutions/06_testing
      STARTER: tanstack-query-vue/workshops/06_testing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-vue/workshops/06_testing/.nvmrc

      # No shared spec for 06, but the app still imports the fake API.
      - name: Sync the shared API
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-vue

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution's tests pass
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      - name: The starter typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      - name: The starter is green (its tests are todos)
        run: npm test
        working-directory: ${{ env.STARTER }}
