name: Training

# Checks then deploys ONE training, called by deploy-trainings.yml once per
# training to deploy: two jobs, the deploy waiting for the workshops to be
# green, so a broken training holds back its own deploy only.

on:
  workflow_call:
    inputs:
      dir:
        description: The training folder, e.g. tanstack-query-react
        required: true
        type: string
      slug:
        description: The `slug` of its training.config.mjs
        required: true
        type: string
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: false

jobs:
  # One job for all the workshops of the training — not one per workshop:
  # scripts/check-workshops.mjs runs them side by side, prints the log of each
  # in its own collapsible group, and sums them up in the job summary. What it
  # checks, and what a training configures in its workshops.ci.mjs, is described
  # in scripts/workshops-ci.mjs.
  workshops:
    name: Workshops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's own Node is enough to read the plan.
      - id: plan
        env:
          TRAINING: ${{ inputs.dir }}
        run: |
          node scripts/workshops-ci.mjs "$TRAINING" > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          node -p "'workshops=' + JSON.stringify(require(process.env.RUNNER_TEMP + '/plan.json').workshops)" >> "$GITHUB_OUTPUT"
          node -p "'verify-script=' + require(process.env.RUNNER_TEMP + '/plan.json').verifyScript" >> "$GITHUB_OUTPUT"
          node -p "'elasticsearch=' + require(process.env.RUNNER_TEMP + '/plan.json').elasticsearch" >> "$GITHUB_OUTPUT"

      # Workshops that are npm projects: every one of them, side by side.
      - uses: actions/setup-node@v7
        if: steps.plan.outputs.workshops != '[]'
        with:
          node-version-file: ${{ inputs.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/*/*/package-lock.json

      - name: Check the workshops
        if: steps.plan.outputs.workshops != '[]'
        env:
          TRAINING: ${{ inputs.dir }}
        run: node scripts/check-workshops.mjs "$TRAINING"

      # A training whose workshops are not npm projects checks them all at once
      # with its own `verify` script.
      - uses: pnpm/action-setup@v6
        if: steps.plan.outputs.verify-script == 'true'
        with:
          # The version comes from the `packageManager` field of the training's
          # package.json, so pnpm is pinned in exactly one place.
          package_json_file: ${{ inputs.dir }}/package.json

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.verify-script == 'true'
        with:
          node-version-file: ${{ inputs.dir }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.dir }}/pnpm-lock.yaml

      - name: Verify the workshop solutions
        if: steps.plan.outputs.verify-script == 'true'
        working-directory: ${{ inputs.dir }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run verify

      - name: The starters must still be unsolved
        if: steps.plan.outputs.verify-script == 'true'
        working-directory: ${{ inputs.dir }}
        env:
          TRAINING: ${{ inputs.dir }}
        run: |
          if pnpm run verify --dir workshops; then
            echo "::error::The starters pass the solution suite — an answer leaked into $TRAINING/workshops/"
            exit 1
          fi
          echo "Starters fail as expected."

      # Guided workshops, run in Kibana Dev Tools: every request of their READMEs,
      # and of the examples of the slides, is replayed against the Elasticsearch
      # of the training's Dockerfile.
      - name: Start Elasticsearch
        if: steps.plan.outputs.elasticsearch != ''
        env:
          CONTEXT: ${{ inputs.dir }}/${{ steps.plan.outputs.elasticsearch }}
        run: |
          docker build -t training-es "$CONTEXT"
          docker run -d --name training-es -p 9200:9200 training-es

      - name: Replay the workshops against Elasticsearch
        if: steps.plan.outputs.elasticsearch != ''
        env:
          TRAINING: ${{ inputs.dir }}
          ES_URL: http://localhost:9200
          # Set by the Dockerfile: a throwaway cluster, local to the runner.
          ES_PASSWORD: training
          # Where the Dockerfile lives, next to the fixtures of the chapters.
          ES_CI_DIR: ${{ steps.plan.outputs.elasticsearch }}
        run: node scripts/check-console.mjs "$TRAINING"

      - name: Elasticsearch logs
        if: failure() && steps.plan.outputs.elasticsearch != ''
        run: docker logs training-es 2>&1 | tail -200

  deploy:
    name: Deploy
    needs: workshops
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE: ${{ vars.NETLIFY_SITE_PREFIX }}${{ inputs.slug }}
      # The PDF exports print with the Chrome the runner ships, rather than
      # downloading a Chromium on every run.
      TRAINING_KIT_CHROME: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.dir }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # A PR from a fork gets no secrets: the build above still proves it builds.
      - name: Deploy
        if: env.NETLIFY_AUTH_TOKEN != ''
        env:
          TEAM: ${{ vars.NETLIFY_TEAM }}
          PROD: ${{ github.event_name != 'pull_request' }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          args=(--dir build --no-build --site-name "$SITE" --json --message "$GITHUB_SHA")
          if [ -n "$TEAM" ]; then args+=(--team "$TEAM"); fi
          if [ "$PROD" = true ]; then args+=(--prod); else args+=(--alias "$ALIAS"); fi

          npx --yes netlify-cli@27.11.2 deploy "${args[@]}" > "$RUNNER_TEMP/deploy.json"
          url=$(node -p "const d = require(process.env.RUNNER_TEMP + '/deploy.json'); process.env.PROD === 'true' ? d.url : d.deploy_url")
          echo "### ${{ inputs.slug }}: $url" >> "$GITHUB_STEP_SUMMARY"
