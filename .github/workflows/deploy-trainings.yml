name: Deploy the trainings

# One Netlify site per training-kit project — every top-level folder holding a
# training.config.mjs. Nothing to configure per training, neither here nor in the
# Netlify UI: scripts/trainings-to-deploy.mjs finds the trainings a push touched,
# and `netlify deploy --site-name` creates the site the first time it deploys to it.
#
#   site name  = vars.NETLIFY_SITE_PREFIX + the `slug` of training.config.mjs
#   push main  → production deploy
#   PR         → preview deploy at pr-<number>--<site>.netlify.app (job summary)
#   dispatch   → production deploy of every training
#
# One-time setup, in the repository settings:
#   secret   NETLIFY_AUTH_TOKEN   a Netlify personal access token
#   variable NETLIFY_SITE_PREFIX  e.g. `edemey-` — site names are global on Netlify
#   variable NETLIFY_TEAM         the team slug new sites are created in (optional
#                                 with a single team)
#
# The sites are built HERE, not by Netlify: they must not be linked to the
# repository in the Netlify UI, or each push would deploy twice. The headers of
# each training's netlify.toml still apply: the CLI reads it from the folder it
# deploys from.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-trainings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Trainings to deploy
    runs-on: ubuntu-latest
    outputs:
      trainings: ${{ steps.detect.outputs.trainings }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: detect
        env:
          # The push diff, or the PR diff. A new branch has no `before` (all
          # zeros), and a dispatch none at all: everything is deployed.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            trainings=$(node scripts/trainings-to-deploy.mjs)
          else
            trainings=$(node scripts/trainings-to-deploy.mjs "$BASE" "$GITHUB_SHA")
          fi
          echo "trainings=$trainings" >> "$GITHUB_OUTPUT"
          echo "Trainings to deploy: $trainings"

  deploy:
    name: ${{ matrix.training.slug }}
    needs: detect
    if: needs.detect.outputs.trainings != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One broken training must not hold back the deploy of the others.
      fail-fast: false
      matrix:
        training: ${{ fromJSON(needs.detect.outputs.trainings) }}
    defaults:
      run:
        working-directory: ${{ matrix.training.dir }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE: ${{ vars.NETLIFY_SITE_PREFIX }}${{ matrix.training.slug }}
      # The PDF exports print with the Chrome the runner ships, rather than
      # downloading a Chromium on every run.
      TRAINING_KIT_CHROME: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.training.dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.training.dir }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.training.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # A PR from a fork gets no secrets: the build above still proves it builds.
      - name: Deploy
        if: env.NETLIFY_AUTH_TOKEN != ''
        env:
          TEAM: ${{ vars.NETLIFY_TEAM }}
          PROD: ${{ github.event_name != 'pull_request' }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          args=(--dir build --no-build --site-name "$SITE" --json --message "$GITHUB_SHA")
          if [ -n "$TEAM" ]; then args+=(--team "$TEAM"); fi
          if [ "$PROD" = true ]; then args+=(--prod); else args+=(--alias "$ALIAS"); fi

          npx --yes netlify-cli@27.11.2 deploy "${args[@]}" > "$RUNNER_TEMP/deploy.json"
          url=$(node -p "const d = require(process.env.RUNNER_TEMP + '/deploy.json'); process.env.PROD === 'true' ? d.url : d.deploy_url")
          echo "### ${{ matrix.training.slug }}: $url" >> "$GITHUB_STEP_SUMMARY"
