name: TanStack Query for Angular workshops

# The same guarantee as `vuejs-advanced-workshops.yml`, workshop by workshop:
# the solution passes the given spec, typechecks and builds, and the starter
# typechecks but must NOT pass the spec.
#
# Each workshop is a standalone Angular CLI project, so there is one job per
# workshop rather than one install for the lot.
#
# The fake API (`src/api/`) and the spec (`src/tests/shared/`) of every
# workshop are gitignored copies of `tanstack-query-common/`: the sync writes
# them right after the checkout, and a change in the shared folder re-runs
# this workflow.

on:
  push:
    paths:
      - 'tanstack-query-angular/workshops/**'
      - 'tanstack-query-angular/solutions/**'
      - 'tanstack-query-common/**'
      - '.github/workflows/tanstack-query-angular-workshops.yml'
  pull_request:
    paths:
      - 'tanstack-query-angular/workshops/**'
      - 'tanstack-query-angular/solutions/**'
      - 'tanstack-query-common/**'
  workflow_dispatch:

jobs:
  workshop:
    name: ${{ matrix.workshop }}
    runs-on: ubuntu-latest
    strategy:
      # One broken workshop must not hide the state of the others.
      fail-fast: false
      matrix:
        workshop:
          - 01_first_queries
          - 02_query_configuration
          - 03_pagination_infinite
          - 04_mutations
          - 05_optimistic_updates

    env:
      SOLUTION: tanstack-query-angular/solutions/${{ matrix.workshop }}
      STARTER: tanstack-query-angular/workshops/${{ matrix.workshop }}

    steps:
      - uses: actions/checkout@v7

      - name: Copy the shared API and specs into the workshops
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-angular

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-angular/workshops/${{ matrix.workshop }}/.nvmrc

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution passes the shared spec
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: The solution builds
        run: npm run build
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      # The spec is part of the typecheck program, so this also proves it only
      # references what the starter already exposes. A spec that fails to
      # COMPILE would be a broken exercise, not a red test.
      - name: The starter still typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      # `--reporters=default` drops the `github-actions` reporter Vitest adds on
      # its own under CI: every red spec here is expected, and would otherwise
      # surface as an error annotation on a green run.
      - name: The starter must still be unsolved
        working-directory: ${{ env.STARTER }}
        run: |
          if npm test -- --reporters=default; then
            echo "::error::The starter passes the given spec — an answer leaked into ${{ env.STARTER }}"
            exit 1
          fi
          echo "Starter fails as expected."

  # Workshop 06 is the one where the LEARNER writes the tests: it has no shared
  # spec, and its starter is a list of `it.todo`s — green from the start, so
  # "the starter must fail" is meaningless there. What can break is checked
  # instead: the solution's own tests pass, both projects typecheck, the
  # solution builds, and the starter stays green (a todo list that no longer
  # compiles or runs would be a broken exercise).
  testing-workshop:
    name: 06_testing
    runs-on: ubuntu-latest

    env:
      SOLUTION: tanstack-query-angular/solutions/06_testing
      STARTER: tanstack-query-angular/workshops/06_testing

    steps:
      - uses: actions/checkout@v7

      - name: Copy the shared API into the workshops
        run: node tanstack-query-common/scripts/sync.mjs tanstack-query-angular

      - uses: actions/setup-node@v7
        with:
          node-version-file: tanstack-query-angular/workshops/06_testing/.nvmrc

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution's tests pass
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: The solution builds
        run: npm run build
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      - name: The starter typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      - name: The starter's todo list runs green
        run: npm test
        working-directory: ${{ env.STARTER }}
