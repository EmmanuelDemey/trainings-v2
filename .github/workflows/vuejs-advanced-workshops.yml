name: Vue.js advanced workshops

# The same guarantee as `javascript-workshops.yml`, workshop by workshop:
# the solution passes the given specs, and the starter must NOT.
#
# Each workshop is a standalone npm project, so there is one job per workshop
# rather than one install for the lot.
#
# `03_testing` and `12_testing_integration` are deliberately absent: they are the
# workshops where the LEARNER writes the tests, so their starters are green from
# the start: `03_testing` ships empty tests that assert nothing, next to a few
# given worked examples, and `12_testing_integration` ships `it.todo`s. "The
# starter must fail" is meaningless there.

on:
  push:
    paths:
      - 'training/chapters/vuejs_advanced/tp/**'
      - 'training/solutions/vuejs_advanced/**'
      - '.github/workflows/vuejs-advanced-workshops.yml'
  pull_request:
    paths:
      - 'training/chapters/vuejs_advanced/tp/**'
      - 'training/solutions/vuejs_advanced/**'
  workflow_dispatch:

jobs:
  workshop:
    name: ${{ matrix.workshop }}
    runs-on: ubuntu-latest
    strategy:
      # One broken workshop must not hide the state of the others.
      fail-fast: false
      matrix:
        workshop:
          - 01_devtools
          - 02_composables_directives
          - 04_plugins
          - 05_composables_library
          - 06_router
          - 07_advanced_components
          - 08_unplugin
          - 09_pinia
          - 10_transitions
          - 11_forms
          - 13_error_handling
          - 14_component_architecture
          - 15_i18n
          - 16_production
          - 17_tanstack_query

    env:
      SOLUTION: training/solutions/vuejs_advanced/${{ matrix.workshop }}
      STARTER: training/chapters/vuejs_advanced/tp/${{ matrix.workshop }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: training/chapters/vuejs_advanced/tp/${{ matrix.workshop }}/.nvmrc

      - name: Install the solution
        run: npm ci
        working-directory: ${{ env.SOLUTION }}

      - name: The solution passes its own specs
        run: npm test
        working-directory: ${{ env.SOLUTION }}

      - name: The solution typechecks
        run: npm run typecheck
        working-directory: ${{ env.SOLUTION }}

      - name: Install the starter
        run: npm ci
        working-directory: ${{ env.STARTER }}

      # The specs are part of the typecheck program, so this also proves they
      # only reference symbols the skeleton already exposes. A spec that fails
      # to COMPILE would be a broken exercise, not a red test.
      - name: The starter still typechecks
        run: npm run typecheck
        working-directory: ${{ env.STARTER }}

      # `--reporter=default` drops the `github-actions` reporter Vitest adds on
      # its own under CI: every red spec here is expected, and would otherwise
      # surface as an error annotation on a green run.
      - name: The starter must still be unsolved
        working-directory: ${{ env.STARTER }}
        run: |
          if npm test -- --reporter=default; then
            echo "::error::The starter passes the given specs — an answer leaked into ${{ env.STARTER }}"
            exit 1
          fi
          echo "Starter fails as expected."
