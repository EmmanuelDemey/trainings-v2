version: 2
updates:
  # The npm dependencies: one block per training (every top-level folder holding
  # a training.config.mjs), its own package.json and those of its workshops and
  # solutions. Each pull request therefore touches ONE training, whose CI alone
  # decides its merge: .github/workflows/dependabot-auto-merge.yml merges it once
  # the CI of that training is green (deploy-trainings.yml only checks the
  # trainings a pull request touches). scripts/dependabot.test.mjs fails when a
  # training has no block.
  #
  # Two groups per training: a major update that breaks a workshop must not hold
  # back the minor and patch ones.
  - package-ecosystem: npm
    directories:
      - /elasticsearch
    schedule:
      interval: weekly
    groups:
      elasticsearch:
        update-types: [minor, patch]
      elasticsearch-major:
        update-types: [major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directories:
      - /elastic-security
    schedule:
      interval: weekly
    groups:
      elastic-security:
        update-types: [minor, patch]
      elastic-security-major:
        update-types: [major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directories:
      - /javascript
    schedule:
      interval: weekly
    groups:
      javascript:
        update-types: [minor, patch]
      javascript-major:
