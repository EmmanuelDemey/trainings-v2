version: 2
updates:
  # The Elasticsearch the workshops of the Elastic trainings (elasticsearch,
  # elastic-security) are replayed against (elasticsearch-common/ci/Dockerfile): a pull request for each new release,
  # whose CI replays every workshop on it — see scripts/check-console.mjs.
  - package-ecosystem: docker
    directory: /elasticsearch-common/ci
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The OpenSearch the workshops of the OpenSearch training are replayed against
  # (opensearch/ci/Dockerfile).
  - package-ecosystem: docker
    directory: /opensearch/ci
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
