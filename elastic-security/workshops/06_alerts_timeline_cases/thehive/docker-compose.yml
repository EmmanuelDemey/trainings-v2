# TheHive, pour l'exercice 7 (optionnel) du TP 6 : pousser un case Kibana vers
# un outil de gestion d'incidents. Un seul conteneur — base et index locaux, sans
# Cassandra ni Elasticsearch —, environ 1,5 Go de RAM.
#
#   docker compose up -d --wait          (après la stack du lab, dans ../lab/)
#
# Il rejoint le réseau du lab : Kibana l'appelle http://thehive:9000, le
# navigateur http://localhost:9000 (THEHIVE_PORT=9010 si le port 9000 est pris).
# Compte admin : admin@thehive.local / secret.
name: elastic-security-thehive

services:
  thehive:
    image: strangebee/thehive:5.5
    command: ["--secret", "lab-thehive-secret-0000000000000001", "--no-cql-wait", "--index-backend", "lucene", "--no-config-cortex"]
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
    ports: ["${THEHIVE_PORT:-9000}:9000"]
    networks:
      lab:
        aliases: [thehive]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/status"]
      interval: 10s
      retries: 60

networks:
  lab:
    name: elastic-security-lab_default
    external: true
