# One Netlify site per training. In the Netlify UI, set the BASE DIRECTORY of
# this site to the folder holding this file: Netlify then reads this file, runs
# the build from here, and publishes build/ — the workshops site at the root, the
# deck under /slides/, the PDFs and ZIPs under /downloads/.
[build]
  command = "pnpm run build"
  publish = "build"
  # Skip the deploy when nothing changed in this training: the other trainings
  # live in the same repository and must not rebuild this one. The shared
  # folder is watched too — its slide fragments, fake API and specs end up in
  # this site (the build runs the sync), so a change there must redeploy it.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../tanstack-query-common"

[build.environment]
  # pnpm, from the `packageManager` field of package.json and pnpm-lock.yaml.
  NODE_VERSION = "24"

[[headers]]
  for = "/slides/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
