# The lab of the OpenSearch training: one OpenSearch node and OpenSearch Dashboards,
# locally. Security disabled (plain HTTP, no user): a throwaway lab.
#
#   docker compose up -d --wait
#
# Then http://localhost:5601 → ☰ menu → Dev Tools.
#
# The version is the one of opensearch/ci/Dockerfile, against which the CI replays every
# request of the workshops: both are updated together.
#
# Linux: OpenSearch requires vm.max_map_count ≥ 262144 —
#   sudo sysctl -w vm.max_map_count=262144
name: opensearch-lab

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 5s
      retries: 60

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    depends_on:
      opensearch: { condition: service_healthy }
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"state\":\"green\"'"]
      interval: 10s
      retries: 60
