# Builds the image and publishes it to the GitHub Container Registry on every
# version tag (git tag v1.0.0 && git push --tags).
#
# This file sits inside the workshop folder, so GitHub never runs it: copy it to
# .github/workflows/ at the root of YOUR repository to use it, and adjust
# `context` if the app is not at the root.
name: Publish the Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write # push to ghcr.io with the GITHUB_TOKEN — no secret to create

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Turns the git tag v1.2.3 into the image tags 1.2.3, 1.2 and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU + Buildx: one image for both x86 servers and ARM machines.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The Dockerfile runs `npm ci` and `npm run build` itself: the job needs
      # no Node.js. The build stage is cached between runs in the Actions cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
