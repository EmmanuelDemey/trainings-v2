# The nginx server of the image — INCOMPLETE on purpose. As it stands it serves
# the home page and nothing else: a deep link is a 404, every asset is
# re-downloaded on every visit, and a non-root nginx cannot even bind port 80.

server {
  # TODO 4.1: a process that is not root cannot bind a port below 1024. Listen
  #   on 8080 — the port the Dockerfile EXPOSEs and the Deployment declares.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # TODO 4.2: the SPA fallback. /people/leia-organa is not a file: it is a route,
  #   which only exists once index.html has booted the app. Serve index.html for
  #   any path that matches no file: `try_files $uri $uri/ /index.html;`
  location / {
    try_files $uri $uri/ =404;
  }

  # TODO 4.3: `location /assets/` — the file names are content-hashed, so cache
  #   them for a year: `add_header Cache-Control "public, max-age=31536000, immutable";`
  #   And keep them OUT of the fallback with `try_files $uri =404;`: a missing
  #   chunk must be a 404, not index.html served as JavaScript.

  # TODO 4.4: two exact locations that must never be cached:
  #   `location = /index.html` → `Cache-Control "no-cache"` (revalidate: it names
  #   the chunks of the current deployment), and `location = /env.js` →
  #   `Cache-Control "no-store"` (it changes with the container, not the build).

  # TODO 4.5: `location = /healthz` answering `return 200 "ok\n";` with
  #   `default_type text/plain;` and `access_log off;` — the probes of the
  #   Deployment call it every few seconds.
}
