# The nginx server of the image. Each block answers one question a static host
# answers for you — here you answer it yourself.

server {
  # A non-root process cannot bind a port below 1024.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The SPA fallback: /people/leia-organa is a route, not a file. Any path that
  # matches no file gets index.html, and the app reads the URL itself.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed file names: a new build means new names, so these can be
  # cached forever. And NO fallback here: a chunk missing after a deployment
  # must be a 404, not index.html parsed as JavaScript ("Unexpected token '<'").
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html names the chunks of the CURRENT deployment: always revalidate it.
  # The fallback above lands here too, so deep links are never cached either.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rewritten at every container start: never stored, by anyone.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # For the readiness and liveness probes of the Deployment.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
